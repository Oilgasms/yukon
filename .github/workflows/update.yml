name: Update the town

on:
  schedule:
    - cron: '17 1,13 * * *' # about 6:15 am and 6:15 pm in Whitehorse
  workflow_dispatch: # the "Run workflow" button, for an update right now
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: town
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the updater's dependencies
        if: github.event_name != 'push'
        run: npm install --prefix scripts --no-audit --no-fund
      - name: Fetch sheets, Strava, Letterboxd and book lines
        if: github.event_name != 'push'
        run: node scripts/update.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_CODE: ${{ secrets.STRAVA_CODE }}
          CRONOMETER_USERNAME: ${{ secrets.CRONOMETER_USERNAME }}
          CRONOMETER_PASSWORD: ${{ secrets.CRONOMETER_PASSWORD }}
          CRONOMETER_GWT_PERMUTATION: ${{ secrets.CRONOMETER_GWT_PERMUTATION }}
          CRONOMETER_GWT_HEADER: ${{ secrets.CRONOMETER_GWT_HEADER }}
      - name: Save the new data
        if: github.event_name != 'push'
        run: |
          git config user.name "town updater"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data state 2>/dev/null || git add data
          git diff --cached --quiet || git commit -m "Update town data"
          # Someone may have pushed while this ran: catch up (keeping the data just fetched) and retry.
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "push failed, trying again in $((i * 5))s"; sleep $((i * 5))
          done
          exit 1
      - name: Leave the updater's tools out of the website
        run: rm -rf scripts/node_modules
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # GitHub sometimes takes a moment to register the upload before it can be published:
      # give it a few seconds, and if publishing still trips, wait and try once more.
      - name: Let GitHub catch up
        run: sleep 10
      - id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before trying again
        if: steps.deploy1.outcome == 'failure'
        run: sleep 45
      - id: deploy
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
