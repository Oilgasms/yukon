name: Update the town

on:
  schedule:
    - cron: '17 1,13 * * *' # about 6:15 am and 6:15 pm in Whitehorse
  workflow_dispatch: # the "Run workflow" button, for an update right now
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: town
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install the updater's dependencies
        if: github.event_name != 'push'
        run: npm install --prefix scripts --no-audit --no-fund
      - name: Fetch sheets, Strava, Letterboxd and book lines
        if: github.event_name != 'push'
        run: node scripts/update.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_CODE: ${{ secrets.STRAVA_CODE }}
      - name: Save the new data
        if: github.event_name != 'push'
        run: |
          git config user.name "town updater"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data state 2>/dev/null || git add data
          git diff --cached --quiet || git commit -m "Update town data"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
